esca_trascina_max_cm=12
# su quale asse la canna si sposta a destra e a sinistra: x, y o z.
# Se muovendola va storta invece che di lato, prova un'altra lettera.
canna_lato_asse=no
# quanto il corpo segue la canna quando la sposti: 0 sta fermo,
# 1 si gira tutto come prima
canna_gira_corpo=1

# quanto vicino devi essere a un'acqua perche' nel menu compaia
