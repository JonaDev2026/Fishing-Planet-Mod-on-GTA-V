# LA STRAPPATA (levetta indietro): su che fotogramma si mette, quanto
# dura, di quanto si alza la canna e quanta lenza si porta a casa
anim_strappo_fase=0.45
anim_strappo_ms=420
canna_strappo=22
strappo_metri=0
# quanto dura la frustata, in millesimi di secondo
