# Pesca
attivo=1

# la canna in mano: spostamento (metri) e rotazione (gradi) dalla mano destra.
# Si puo' ritoccare a gioco acceso: smetti e riprendi a pescare per vedere.
canna_x=0.13
canna_y=0.10
canna_z=0.01
canna_rx=180
canna_ry=90
canna_rz=70

# animazioni: idle_a e' la posa ferma, idle_c e' quella in cui gira
# il mulinello, idle_b e' quella in tiro
# (idle_a, idle_b, idle_c: si scambiano per trovare quella col mulinello)
anim_tira=idle_b
anim_calma=idle_a
anim_recupero=idle_c
# su quale fotogramma si congela la posa ferma: 0 inizio, 1 fine
anim_fermo_fase=0.22

# IL LANCIO. Si prendono i fotogrammi della clip del mulinello: uno a
# canna scarica, uno a canna carica (il busto piegato indietro) e uno
# a fine frustata. Se il movimento non e' quello giusto si spostano
# questi tre numeri, non serve ricompilare.
anim_lancio_da=0.35
anim_lancio_a=0.62
# a che punto della frustata si passa dalla posa piegata a quella dritta
anim_lancio_scatto=0.25

# IL LANCIO: quanto in fretta sale la barra, quanto e' dura la curva
# (1 = dritta, piu' alto = i primi metri costano poco e gli ultimi tanto)
# e il minimo che parte comunque.
carica_vel=1.25
lancio_curva=1.7
lancio_minimo=1.5

# LA STRAPPATA (levetta indietro): su che fotogramma si mette, quanto
# dura, di quanto si alza la canna e quanta lenza si porta a casa
anim_strappo_fase=0.45
anim_strappo_ms=420
canna_strappo=22
strappo_metri=0
# quanto dura la frustata, in millesimi di secondo
anim_lancio_ms=380
# di quanto gira la canna: indietro mentre carichi, avanti nella frustata
canna_indietro=95
canna_avanti=45
# la canna si sposta a destra e a sinistra con la levetta sinistra:
# quanti gradi al secondo, e di quanto al massimo si puo' spostare
# dal punto in cui hai lanciato
canna_gira_vel=55
canna_gira_max=40
# quanto l'esca in acqua viene trascinata quando muovi la canna:
# centimetri per ogni grado di canna, e il massimo che puo' spostarsi
# in tutto. Non e' un angolo: sono centimetri veri, a qualsiasi distanza.
esca_trascina_cm=0.15
esca_trascina_max_cm=12
# su quale asse la canna si sposta a destra e a sinistra: x, y o z.
# Se muovendola va storta invece che di lato, prova un'altra lettera.
canna_lato_asse=no
# quanto il corpo segue la canna quando la sposti: 0 sta fermo,
# 1 si gira tutto come prima
canna_gira_corpo=1

# quanto vicino devi essere a un'acqua perche' nel menu compaia
# "Inizia a pescare a ...", in metri
raggio_menu=200

# IL PESCE CHE ABBOCCA. Quanto sta sotto il pelo dell'acqua, quanto
# sbanda a destra e a sinistra (gradi al secondo e massimo), quanto si
# porta dietro la lenza mentre sbanda, e quanto penzola sotto la punta
# della canna quando lo tiri fuori.
pesce_sotto=0.25
pesce_sbanda=14
pesce_sbanda_max=22
pesce_tira_lenza=0.35
pesce_appeso_giu=1.45
# quanto dondola appeso (metri) e quanto si torce (gradi)
pesce_dondola=0.10
pesce_torce=22

pesce_appeso_becca=78
# dove sta l'amo sul pesce: quanto avanti dal suo centro e' la bocca,
# e uno spostamento di lato se serve (metri)
pesce_bocca_avanti=0.22
pesce_bocca_lato=0
pesce_bocca_su=0
# quanto sta avanti il muso rispetto all'osso della testa (metri)
pesce_muso=0.08
# quanto il filo scende oltre il punto della testa, per chiudere lo
# stacco che resta (metri)
lenza_giu_extra=0.12

# LA FINESTRA DEL PESCE PRESO: dove sta e quanto e' grande.
# card_larga 380 era la misura di prima, in mezzo allo schermo.
card_larga=270
card_x=505
card_y=520
# quanto piu' grandi i testi rispetto alla finestra (1 = in scala)
card_testi=1.3

# quanto si vede la lenza: 0 invisibile, 255 piena. Il colore lo prende
# dalla foto della bobina che hai montato.
lenza_alfa=130
# la pancia del filo: quando e' in tiro e quando e' molle (metri), e
# quanto la pancia si sposta verso l'acqua invece di stare in mezzo
# (0 = curva simmetrica, 1 = tutta appoggiata verso l'esca)
lenza_pancia_tesa=0.06
lenza_pancia_molle=0.24
lenza_appoggio=0.9

# IL GALLEGGIANTE IN ACQUA: quanto e' grosso e di quanto sparisce sotto
# quando il pesce abbocca (metri)
# quanta parte del galleggiante resta fuori dall'acqua (0.55 = poco
# piu' di meta'). Forma, misure e colori vengono da galleggianti.txt.
gall_fuori=0.65
# quanto e' corta la punta colorata in cima (0.22 = un quinto scarso)
gall_punta=0.22
# quanto si corica verso di te quando recuperi (0 resta dritto)
gall_inclina=0.75
# le sferiche: quale delle due mezze sta sopra. 1 = la seconda, 0 = la prima
gall_palla_gira=1
gall_affonda=0.34

# QUANDO IL PESCE MORDICCHIA (solo a galleggiante): da quanto devi
# recuperare perche' si stacchi (0 = un filo, 1 = a tutta). Quanto ci
# mette a tornare lo decidono le regole di pesca; qui c'e' solo il
# minimo, cioe' il caso della modalita' arcade.
strappa_via=0.35
dopo_spavento_ms=12000

# I SUONI NOSTRI: stanno nella cartella "suoni" qui accanto. Se ci metti
# un tuo wav con lo stesso nome, senti il tuo. Lascia il campo vuoto per
# non sentire niente.
suono_lancio_file=lancio.wav
# il tonfo adesso e' il "tiny splash" vero: leggero, ci sta.
suono_tonfo_file=tonfo.wav

# il pesce mostrato in mano: spostamento dalla mano (metri) e rotazione (gradi)
pesce_x=0.08
pesce_y=0
pesce_z=-0.22
pesce_rx=90
pesce_ry=0
pesce_rz=0
finestra_x=440
finestra_y=0
finestra_w=300
lingua=1

# la lunghezza della canna in metri: da qui parte la lenza
canna_lunghezza=1.9
# ritocco all'attacco della lenza, in metri: + la allontana, - la avvicina
canna_agg=0
# il quadrante dello spinning al posto di quello del galleggiante,
# anche se il galleggiante e' montato: serve per provarlo
spin_prova=0

# quanto puo' sforare un unico oltre la tabella del wiki, in percento.
# Il wiki da' il peso dell'unico, ma in gioco ogni tanto ne esce uno piu'
# grosso: Clear Muskie segnati a 30 kg, pescati da 35-37.
unico_extra=20

# la nassa nell'HUD: sta in alto, a sinistra dell'esca
nassa_x=1058
nassa_y=20
nassa_lato=25
nassa_testo=0.30
nassa_testo_x=30
nassa_testo_su=12
nassa_testo2=0.22
nassa_riga2=14

# la barra della canna, le tacche della frizione e i metri: da qui in giu'.
# Abbassando il numero si alza tutto e si avvicina all'acqua.
barra_y=394
# il quadrante dell'acqua sta per conto suo
quadrante_y=296

# PROVA: la canna disegnata da noi invece del modello, cosi' si piega
# quando il pesce tira. 1 accende, 0 rimette il modello di sempre.
canna_disegnata=1
# prova: la disegna rossa, per vedere se si disegna davvero
canna_prova_rossa=0
canna_piega=0.28
# il verso della piega: 1 o -1 se si inarca dalla parte sbagliata
canna_verso=-1
# il colore: scuro al calcio, piu' chiaro in punta
canna_col_giu=22
canna_col_su=60
canna_tratti=14
# lo spessore, finto: quante righe affiancate e quanto distanti
# quanto si allunga all'indietro per arrivare in mano (metri)
canna_calcio=0.12
canna_pieno=3
canna_passo_k=0.0008
; canna a cilindri (DRAW_MARKER) invece che a righe: 1 accende, 0 righe
canna_marker=0
; diametro al calcio in metri, e in punta come frazione del calcio
canna_marker_diam=0.014
canna_marker_punta=0.25
; 1 passa la direzione al marker invece delle rotazioni (se la canna esce storta)
canna_marker_dir=0
canna_spessore=3
canna_largo=0.006

# gli assaggi: quanto prima dell'abboccata cominciano (ms), ogni quanto
# si sentono e quanto durano. Alti = piu' calma.
assaggio_finestra=2600
assaggio_pausa=1200
assaggio_pausa_piu=1400
assaggio_dura=260

# ogni tanto un pesce attraversa vicino all'esca: non abbocca, si vede e
# se ne va. 1 acceso, 0 spento.
pesci_scena=1
# ogni quanti secondi ci prova (poi ci mette del suo, a caso)
pesci_scena_ogni=22
# quanto ci mette ad attraversare, quanto e' lunga la sua strada,
# a quanti metri di lato passa e quanto sta sotto il pelo dell'acqua
pesci_scena_dura=7
pesci_scena_lungo=14
pesci_scena_via=2.2
pesci_scena_giu=0.45

# la robaccia: ogni tanto invece del pesce viene su una scarpa, un cono,
# un sacchetto. Sono percentuali: quanto capita con l'esca montata e
# quanto senza. La tabella degli oggetti e' in robaccia.txt.
robaccia_prob=6
robaccia_prob_senza_esca=35
# quanto resta appesa alla canna prima di sparire, e quanto sotto la punta
roba_appesa_ms=2500
roba_giu=0.5

; ---- la ruota degli attrezzi (LB mentre peschi) ----
; centro e raggio, in pixel su 1280x720
ruota_x=640
ruota_y=360
ruota_raggio=170
; lato delle icone
ruota_icona=56
; -1 se gli spicchi evidenziati non corrispondono alla levetta
ruota_verso=1
; quanto va spinta la levetta destra per scegliere (0..1)
ruota_soglia=0.5
