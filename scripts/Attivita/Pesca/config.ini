# di quanto gira la canna: indietro mentre carichi, avanti nella frustata
canna_indietro=95
canna_avanti=45
# la canna si sposta a destra e a sinistra con la levetta sinistra:
# quanti gradi al secondo, e di quanto al massimo si puo' spostare
# dal punto in cui hai lanciato
canna_gira_vel=55
canna_gira_max=40
# quanto l'esca in acqua viene trascinata quando muovi la canna:
# centimetri per ogni grado di canna, e il massimo che puo' spostarsi
# in tutto. Non e' un angolo: sono centimetri veri, a qualsiasi distanza.
