anim_tira=idle_b
anim_calma=idle_a
anim_recupero=idle_c
# su quale fotogramma si congela la posa ferma: 0 inizio, 1 fine
anim_fermo_fase=0.22

# IL LANCIO. Si prendono i fotogrammi della clip del mulinello: uno a
# canna scarica, uno a canna carica (il busto piegato indietro) e uno
# a fine frustata. Se il movimento non e' quello giusto si spostano
# questi tre numeri, non serve ricompilare.
anim_lancio_da=0.35
anim_lancio_a=0.62
# a che punto della frustata si passa dalla posa piegata a quella dritta
anim_lancio_scatto=0.25

# IL LANCIO: quanto in fretta sale la barra, quanto e' dura la curva
# (1 = dritta, piu' alto = i primi metri costano poco e gli ultimi tanto)
# e il minimo che parte comunque.
carica_vel=1.25
lancio_curva=1.7
