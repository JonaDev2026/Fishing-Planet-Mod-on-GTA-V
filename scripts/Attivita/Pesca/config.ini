# Pesca
attivo=1

# la canna in mano: spostamento (metri) e rotazione (gradi) dalla mano destra.
# Si puo' ritoccare a gioco acceso: smetti e riprendi a pescare per vedere.
canna_x=0.13
canna_y=0.10
canna_z=0.01
